<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledger Balance System</title>
  <link rel="stylesheet" href="style.css"> <!--syntax err: styles.css to style.css-->
</head>
<body>
  <div class="container">
    <img src="ledgerr.png" alt="Ledger Header"> <!--syntax err: ledgerr.png to ledger.png-->
    <h1>Legsgar Balance System</h1>  <!-- spelling error: Legsgar to Ledger-->
    <p id="greeting"></p>
    <div class="form">
      <label>Salary:       <input type="number" id="salary" placeholder="0"></label>
      <label>Food:         <input type="number" id="food" placeholder="0"></label>
      <label>Rent:         <input type="number" id="rent" placeholder="0"></label>
      <label>Others:       <input type="number" id="others" placeholder="0"></label>
      <label>Saving Goal:  <input type="number" id="saving" placeholder="0"></label>
    </div>
    <button onclick="calculate()">Calculate Balance</button>  <!-- missing event handler（onclick): button not connected to function -->
    <div id="result" class="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
